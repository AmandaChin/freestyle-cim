<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mask Example</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        max-width: 1440px;
        margin: 0 auto;
      }

      .panel {
        min-height: 720px;
        padding: 18px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        min-height: 44px;
        margin: 0 0 14px;
        color: #6e6e73;
        font-size: 14px;
        line-height: 1.55;
      }

      .image-box {
        position: relative;
        display: grid;
        min-height: 560px;
        place-items: center;
        overflow: hidden;
        border-radius: 8px;
        background:
          linear-gradient(45deg, rgba(0, 0, 0, 0.04) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(0, 0, 0, 0.04) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(0, 0, 0, 0.04) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(0, 0, 0, 0.04) 75%),
          #fff;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .fill {
        background:
          linear-gradient(45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255, 255, 255, 0.06) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.06) 75%),
          #1d1d1f;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .outline img {
        width: 86%;
        max-height: 520px;
        object-fit: contain;
        filter: contrast(5) brightness(0.35);
      }

      .fill img,
      .effect img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .effect {
        aspect-ratio: 2401 / 1601;
      }

      .effect-base,
      .effect-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .effect-fill {
        background:
          radial-gradient(circle at 25% 18%, rgba(255, 255, 255, 0.65), transparent 22%),
          repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.22) 0 3px, rgba(0, 0, 0, 0.08) 3px 6px),
          #f0a8c8;
        mix-blend-mode: multiply;
        opacity: 0.92;
        mask-image: url("./upper-ui-mask.png");
        mask-repeat: no-repeat;
        mask-size: 100% 100%;
        -webkit-mask-image: url("./upper-ui-mask.png");
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%;
      }

      .caption {
        display: inline-flex;
        margin-top: 12px;
        padding: 5px 10px;
        border-radius: 999px;
        background: #f5f5f7;
        color: #515154;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <section class="panel">
        <h2>描线图</h2>
        <p>给人看的轮廓/裁片参考，只告诉设计师边界在哪里；不能直接拿来做网页换色。</p>
        <div class="image-box outline">
          <img src="./upper-ui-mask.png" alt="鞋帮填充蒙版参考" />
        </div>
        <span class="caption">线条有坐标，但没有可填充面积</span>
      </section>

      <section class="panel">
        <h2>填充蒙版</h2>
        <p>给程序用的透明区域图，白色代表可换色区域，透明代表不受影响；必须和 base 同画布。</p>
        <div class="image-box fill">
          <img src="./upper-ui-mask.png" alt="鞋帮填充蒙版" />
        </div>
        <span class="caption">同尺寸、同位置、可裁切材质</span>
      </section>

      <section class="panel">
        <h2>最终效果</h2>
        <p>程序把颜色/材质图放进填充蒙版，再叠在 base 上。描线图不参与运行时渲染。</p>
        <div class="image-box effect">
          <img class="effect-base" src="./base-ui.png" alt="基础鞋图" />
          <div class="effect-fill" aria-hidden="true"></div>
        </div>
        <span class="caption">base + 材质填充 + 蒙版裁切</span>
      </section>
    </main>
  </body>
</html>
