<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skate Studio</title>
    <link rel="stylesheet" href="./styles.css?v=0.0.9" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Site navigation">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow" id="pageEyebrow">Skate Studio</p>
            <h1 id="pageTitle">轮滑鞋定制</h1>
          </div>
        </div>
        <nav class="top-actions" aria-label="Primary actions">
          <button class="glass-button" id="homeButton" type="button" hidden>首页</button>
          <button class="icon-button" id="resetButton" type="button" title="重置定制">
            <span aria-hidden="true">↺</span>
          </button>
          <button class="primary-button" id="saveButton" type="button">保存方案</button>
        </nav>
      </header>

      <section class="home-view" id="homeView" aria-label="鞋款选择首页">
        <section class="home-hero">
          <div class="home-copy">
            <p class="eyebrow" id="homeProductTag">Collection</p>
            <h2 id="homeProductName">选择你的定制鞋款</h2>
            <p id="homeProductDescription"></p>
            <div class="home-meta" id="homeProductMeta"></div>
          </div>
          <div class="home-showcase" aria-label="当前鞋款预览">
            <div class="home-orbit" aria-hidden="true"></div>
            <div class="home-shoe-art" id="homeShoeArt"></div>
          </div>
        </section>

        <section class="home-picker" aria-label="选择鞋款">
          <div class="section-title">
            <h3>选择鞋款</h3>
            <span>发布态鞋款来自 B 端配置</span>
          </div>
          <div class="home-product-grid" id="homeProductGrid"></div>
        </section>
      </section>

      <section class="workspace is-hidden" id="workspace">
        <section class="workspace-topbar" aria-label="定制控制区">
          <div class="model-strip" id="modelStrip" aria-label="鞋款选择"></div>
          <div class="view-tools">
            <div class="segmented" id="angleTabs" role="tablist" aria-label="角度切换"></div>
            <button class="glass-button customizer-toggle" id="customizerToggleButton" type="button" aria-controls="customizerPanel" aria-expanded="true">收起侧栏</button>
          </div>
        </section>

        <section class="preview-stage" aria-label="Shoe preview">
          <div class="shoe-scene" id="shoeScene">
            <div class="shoe-shadow" aria-hidden="true"></div>
            <div class="shoe-art" id="shoeArt" role="img" aria-label="定制轮滑鞋预览"></div>
          </div>
          <div class="scene-footer">
            <span id="angleMeta"></span>
            <span id="modelMeta"></span>
          </div>
        </section>

        <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

        <aside class="customizer" id="customizerPanel" aria-label="Customization panel">
          <div class="panel-top">
            <div class="panel-heading">
              <p class="eyebrow">Customize</p>
              <h2 id="modelName">YJS-pro CIM</h2>
              <p id="modelDescription"></p>
            </div>
            <button class="icon-button drawer-close" id="drawerCloseButton" type="button" title="关闭颜色和布料面板">
              <span aria-hidden="true">×</span>
            </button>
          </div>

          <section class="selected-part-card" aria-live="polite">
            <p class="eyebrow">Selected Part</p>
            <h3 id="selectedPartTitle">正在编辑：上身鞋片</h3>
          </section>

          <div class="customizer-scroll">
            <section class="control-block color-block">
              <div class="section-title">
                <h3>颜色</h3>
                <span id="selectedColorName"></span>
              </div>
              <div class="swatch-grid" id="swatchGrid"></div>
            </section>

            <section class="control-block texture-block">
              <div class="section-title">
                <h3>材质 / 选项</h3>
                <span id="selectedTextureName"></span>
              </div>
              <div class="texture-list" id="textureList"></div>
            </section>

            <section class="summary-block">
              <div class="section-title">
                <h3>配置</h3>
                <button class="text-button" id="copyConfigButton" type="button">复制 JSON</button>
              </div>
              <pre id="configPreview"></pre>
            </section>
          </div>
        </aside>

        <section class="part-rail-block" aria-label="裁片选择">
          <div class="section-title">
            <h3>裁片</h3>
            <span id="selectedPartLabel"></span>
          </div>
          <div class="part-rail" id="partRail"></div>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./b-side/data/cim-config.js?v=20260511-shared"></script>
    <script src="./version.js?v=0.0.9"></script>
    <script src="./app.js?v=0.0.9"></script>
  </body>
</html>
