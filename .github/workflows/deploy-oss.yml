name: Deploy static site to Aliyun OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-oss-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
      OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OSS configuration
        run: |
          set -euo pipefail
          test -n "$OSS_BUCKET"
          test -n "$OSS_ENDPOINT"
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"

      - name: Install ossutil
        run: |
          set -euo pipefail
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh -o /tmp/install-ossutil.sh
          sudo bash /tmp/install-ossutil.sh || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 3 ]; then
            exit "$status"
          fi
          ossutil version

      - name: Configure ossutil
        run: |
          set -euo pipefail
          cat > ~/.ossutilconfig <<EOF
          [Credentials]
          language = EN
          endpoint = ${OSS_ENDPOINT}
          accessKeyID = ${OSS_ACCESS_KEY_ID}
          accessKeySecret = ${OSS_ACCESS_KEY_SECRET}
          EOF
          chmod 600 ~/.ossutilconfig

      - name: Prepare static files
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/skate-cim-oss-dist"
          mkdir -p "$DIST"
          rsync -a --delete ./ "$DIST" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.local-data/' \
            --exclude '.worktrees/' \
            --exclude 'node_modules/' \
            --exclude 'server/' \
            --exclude 'tests/' \
            --exclude '.DS_Store' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'LOCAL_BSIDE_BACKEND.md'

      - name: Sync to OSS
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/skate-cim-oss-dist/"
          PREFIX="${OSS_PREFIX:-}"
          if [ -n "$PREFIX" ]; then
            PREFIX="${PREFIX%/}/"
          fi
          ossutil sync "$DIST" "oss://${OSS_BUCKET}/${PREFIX}" --delete -f
